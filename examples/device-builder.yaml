# ESPHome: configurația completă a plăcii ESP32 DevKit V1, salvată din Device Builder.
# Pe o placă nouă: păstrează secțiunile generate la ADOPT (esphome:, esp32:, api: cu cheia
# de criptare, ota:, wifi:) și adaugă restul de aici; unește blocurile api: și wifi:.
# Parolele sunt !secret (secrets.yaml din Device Builder). Cablare și explicații: README.md, sensors.md.
esphome:
  name: esphome-web-3053a0
  friendly_name: esphome-web-3053a0
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  # fără HA conectat atâta timp, placa repornește (implicit 15min)
  reboot_timeout: 5min
  # HA s-a deconectat: comanda de oprire n-ar mai ajunge, deci oprește sunetul aici
  on_client_disconnected:
    - switch.turn_off: buzzer_activ
    - rtttl.stop
  actions:
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play: !lambda "return song_str;"
    # oprește melodia: „Sunet Morse” = RTTTL o pornește cu LED-ul și o oprește când se stinge
    - action: stop_rtttl
      then:
        - rtttl.stop

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  # fără economie de energie: altfel comenzile rapide (punctele Morse) pot
  # ajunge grupate și unele se pierd. Vezi esphome-leds.yaml.
  power_save_mode: none
  # fără WiFi atâta timp, placa repornește (implicit 15min)
  reboot_timeout: 5min
  # WiFi conectat (și la pornire): două note în sus, cântate de placă, fără HA
  on_connect:
    - rtttl.play: "wifi_on:d=16,o=6,b=180:c,g"
  # WiFi pierdut: oprește sunetul imediat, fără să aștepte deconectarea de la HA,
  # apoi două note în jos (comanda de oprire de la HA n-ar mai ajunge)
  on_disconnect:
    - switch.turn_off: buzzer_activ
    - rtttl.stop
    - rtttl.play: "wifi_off:d=8,o=5,b=140:g,c"
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_demo_ssid
      password: !secret wifi_demo_password
  # Fără hotspot propriu (ap: + captive_portal:): pe o rețea aglomerată (biserica,
  # ~50 de telefoane) încurca reconectarea; placa insistă pe rețelele de mai sus.
  # IP-ul: rezervare pe router (DHCP), ca să nu rămână fără adresă când rețeaua e plină.

# "Change Wi-Fi" prin USB pe web.esphome.io
improv_serial:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Buton (HW-483)"
    filters:
      - delayed_on: 10ms    # debounce
      - delayed_off: 10ms

sensor:
  # Lumina - ramane cum era
  - platform: adc
    pin: GPIO34
    name: "Senzor Lumina (HW-486)"
    attenuation: 12db
    update_interval: 2s

  # Temperatura - lantul de 3 pasi
  - platform: adc
    pin: GPIO35
    id: temp_raw
    attenuation: 12db
    update_interval: 2s
    internal: true
  - platform: resistance
    sensor: temp_raw
    configuration: DOWNSTREAM   # daca valorile sunt absurde/inverse: UPSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V
    id: temp_resistance
    internal: true
  - platform: ntc
    sensor: temp_resistance
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: "Temperatura (HW-498)"

  # Diagnostic: semnalul și de cât timp merge placa fără repornire
  - platform: wifi_signal
    name: "Semnal WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

# Diagnostic: pe ce rețea / IP e placa și de ce a repornit ultima dată
debug:
  update_interval: 60s

text_sensor:
  - platform: wifi_info
    ssid:
      name: "Retea WiFi"
    ip_address:
      name: "IP"
  - platform: debug
    reset_reason:
      name: "Motiv repornire"

output:
  - platform: gpio
    pin: GPIO2
    id: out_onboard
  - platform: gpio
    pin: GPIO23
    id: out_galben
  - platform: gpio
    pin: GPIO22
    id: out_rosu
  - platform: gpio
    pin: GPIO21
    id: out_albastru
  - platform: gpio
    pin: GPIO19
    id: out_verde
  - platform: gpio
    pin: GPIO18
    id: out_alb
  # Buzzer pasiv - cu suport de melodii
  - platform: ledc
    pin: GPIO26
    id: buzzer_pasiv

rtttl:
  output: buzzer_pasiv

light:
  - platform: binary
    name: "LED Placa"
    output: out_onboard
  - platform: binary
    name: "LED Galben"
    output: out_galben
  - platform: binary
    name: "LED Rosu"
    output: out_rosu
  - platform: binary
    name: "LED Albastru"
    output: out_albastru
  - platform: binary
    name: "LED Verde"
    output: out_verde
  - platform: binary
    name: "LED Alb"
    output: out_alb

# Buzzer activ - ca un switch simplu
switch:
  - platform: gpio
    pin: GPIO25
    id: buzzer_activ
    name: "Buzzer (HW-512)"
    restore_mode: ALWAYS_OFF  # după o repornire, tăcut
    icon: "mdi:bullhorn"