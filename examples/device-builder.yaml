# ESPHome: configurația completă a plăcii ESP32 DevKit V1, salvată din Device Builder.
# Pe o placă nouă: păstrează secțiunile generate la ADOPT (esphome:, esp32:, api: cu cheia
# de criptare, ota:, wifi:) și adaugă restul de aici; unește blocurile api: și wifi:.
# Parolele sunt !secret (secrets.yaml din Device Builder). Cablare și explicații: README.md, componente.md.
esphome:
  name: esphome-web-3053a0
  friendly_name: esphome-web-3053a0
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  # fără HA conectat atâta timp, placa repornește (implicit 15min)
  reboot_timeout: 5min
  # HA s-a deconectat: comanda de oprire n-ar mai ajunge, deci oprește sunetul aici
  on_client_disconnected:
    - switch.turn_off: buzzer_activ
    - rtttl.stop
  actions:
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play: !lambda "return song_str;"
    # oprește melodia: „Sunet Morse” = RTTTL o pornește cu LED-ul și o oprește când se stinge
    - action: stop_rtttl
      then:
        - rtttl.stop
    # trimite un cod IR pe HW-489, ex. cod: "NEC 0x00FF 0x45" (formatul din „Cod IR primit”).
    # string, nu int: codurile Samsung/LG depășesc int32
    - action: trimite_ir
      variables:
        cod: string
      then:
        - script.execute:
            id: trimite_ir
            cod: !lambda "return cod;"

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  # fără economie de energie: altfel comenzile rapide (punctele Morse) pot
  # ajunge grupate și unele se pierd. Vezi esphome-leds.yaml.
  power_save_mode: none
  # fără WiFi atâta timp, placa repornește (implicit 15min)
  reboot_timeout: 5min
  # WiFi conectat (și la pornire): două note în sus, cântate de placă, fără HA
  on_connect:
    - rtttl.play: "wifi_on:d=16,o=6,b=180:c,g"
  # WiFi pierdut: oprește sunetul imediat, fără să aștepte deconectarea de la HA,
  # apoi două note în jos (comanda de oprire de la HA n-ar mai ajunge)
  on_disconnect:
    - switch.turn_off: buzzer_activ
    - rtttl.stop
    - rtttl.play: "wifi_off:d=8,o=5,b=140:g,c"
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_demo_ssid
      password: !secret wifi_demo_password
  # Fără hotspot propriu (ap: + captive_portal:): pe o rețea aglomerată (biserica,
  # ~50 de telefoane) încurca reconectarea; placa insistă pe rețelele de mai sus.
  # IP-ul: rezervare pe router (DHCP), ca să nu rămână fără adresă când rețeaua e plină.

# "Change Wi-Fi" prin USB pe web.esphome.io
improv_serial:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Buton (HW-483)"
    filters:
      - delayed_on: 10ms    # debounce
      - delayed_off: 10ms
  # PIR SR602: OUT e 3.3V cât timp vede mișcare (+ câteva secunde după).
  # pulldown: fără modul legat, pinul nu plutește (nu apar mișcări false)
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pulldown: true
    name: "Miscare (SR602)"
    device_class: motion

sensor:
  # Lumina - ramane cum era
  - platform: adc
    pin: GPIO34
    name: "Senzor Lumina (HW-486)"
    attenuation: 12db
    update_interval: 2s

  # Temperatura - lantul de 3 pasi
  - platform: adc
    pin: GPIO35
    id: temp_raw
    attenuation: 12db
    update_interval: 2s
    internal: true
  - platform: resistance
    sensor: temp_raw
    configuration: DOWNSTREAM   # daca valorile sunt absurde/inverse: UPSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V
    id: temp_resistance
    internal: true
  - platform: ntc
    sensor: temp_resistance
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: "Temperatura (HW-498)"

  # Distanța, HC-SR04: Vcc pe 3V3 și Echo direct pe GPIO14; dacă nu merge la 3.3V, Vcc pe VIN (5V)
  # și Echo NUMAI prin divizor (10k + 20k) spre GPIO14. Vezi componente.md.
  # Fără ecou (nimic în față sau prea departe) valoarea e „necunoscut”.
  - platform: ultrasonic
    trigger_pin: GPIO13
    echo_pin: GPIO14
    name: "Distanta (HC-SR04)"
    update_interval: 1s
    timeout: 4m
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 5
          send_every: 1

  # Diagnostic: semnalul și de cât timp merge placa fără repornire
  - platform: wifi_signal
    name: "Semnal WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

# Diagnostic: pe ce rețea / IP e placa și de ce a repornit ultima dată
debug:
  update_interval: 60s

text_sensor:
  # ultimul cod citit de HW-490, în formatul pe care îl primește și trimite_ir
  - platform: template
    id: ir_primit
    name: "Cod IR primit (HW-490)"
    icon: "mdi:remote"
  - platform: wifi_info
    ssid:
      name: "Retea WiFi"
    ip_address:
      name: "IP"
  - platform: debug
    reset_reason:
      name: "Motiv repornire"

output:
  - platform: gpio
    pin: GPIO2
    id: out_onboard
  - platform: gpio
    pin: GPIO23
    id: out_galben
  - platform: gpio
    pin: GPIO22
    id: out_rosu
  - platform: gpio
    pin: GPIO21
    id: out_albastru
  - platform: gpio
    pin: GPIO19
    id: out_verde
  - platform: gpio
    pin: GPIO18
    id: out_alb
  # Buzzer pasiv - cu suport de melodii
  # Canalele ledc 0+1, 2+3 ... împart același timer: buzzerul pe 0 și servo-ul pe 2,
  # altfel fiecare notă RTTTL ar schimba și frecvența servo-ului (50 Hz).
  - platform: ledc
    pin: GPIO26
    id: buzzer_pasiv
    channel: 0
  # Servo SG90: semnalul (firul portocaliu) pe GPIO32, 50 Hz
  - platform: ledc
    pin: GPIO32
    id: servo_pwm
    frequency: 50 Hz
    channel: 2

servo:
  - id: servo_sg90
    output: servo_pwm
    # după 1 s fără comandă oprește impulsurile: servo-ul nu mai bâzâie și nu trage curent
    auto_detach_time: 1s
    # dacă nu ajunge la 0° / 180°: min_level: 2.5%, max_level: 12.5%

rtttl:
  output: buzzer_pasiv

light:
  - platform: binary
    name: "LED Placa"
    output: out_onboard
  - platform: binary
    name: "LED Galben"
    output: out_galben
  - platform: binary
    name: "LED Rosu"
    output: out_rosu
  - platform: binary
    name: "LED Albastru"
    output: out_albastru
  - platform: binary
    name: "LED Verde"
    output: out_verde
  - platform: binary
    name: "LED Alb"
    output: out_alb

# Buzzer activ - ca un switch simplu
switch:
  - platform: gpio
    pin: GPIO25
    id: buzzer_activ
    name: "Buzzer (HW-512)"
    restore_mode: ALWAYS_OFF  # după o repornire, tăcut
    icon: "mdi:bullhorn"

# Receptor IR (HW-490), pe pinul marcat RX2 (GPIO16): ieșirea modulului e activă pe 0, deci inverted.
# Codul citit ajunge în „Cod IR primit” ca „PROTOCOL număr număr”, ex. „NEC 0x00FF 0x45”,
# „SAMSUNG 0xE0E040BF 32” (date + nr. de biți). Toate protocoalele apar și în log (dump).
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO16
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%
  filter: 50us
  idle: 10ms
  on_nec:
    - text_sensor.template.publish:
        id: ir_primit
        state: !lambda |-
          char buf[40];
          snprintf(buf, sizeof(buf), "NEC 0x%04X 0x%04X", x.address, x.command);
          return std::string(buf);
  on_samsung:
    - text_sensor.template.publish:
        id: ir_primit
        state: !lambda |-
          char buf[40];
          snprintf(buf, sizeof(buf), "SAMSUNG 0x%llX %u", (unsigned long long) x.data, x.nbits);
          return std::string(buf);
  on_sony:
    - text_sensor.template.publish:
        id: ir_primit
        state: !lambda |-
          char buf[40];
          snprintf(buf, sizeof(buf), "SONY 0x%X %u", (unsigned) x.data, x.nbits);
          return std::string(buf);
  on_rc5:
    - text_sensor.template.publish:
        id: ir_primit
        state: !lambda |-
          char buf[40];
          snprintf(buf, sizeof(buf), "RC5 0x%02X 0x%02X", x.address, x.command);
          return std::string(buf);
  on_lg:
    - text_sensor.template.publish:
        id: ir_primit
        state: !lambda |-
          char buf[40];
          snprintf(buf, sizeof(buf), "LG 0x%08X %u", (unsigned) x.data, x.nbits);
          return std::string(buf);

# Emițător IR (HW-489), pe pinul D4 (GPIO4). Bătaia e mică (LED-ul e alimentat direct din pin, 3.3V):
# ține-l la 1-2 m de aparat, îndreptat spre el.
# Pe HW-489, LED-ul e între „+” (3V3) și S: se aprinde când S e 0, deci pinul e inverted
# (fără, LED-ul stă aprins tot timpul și semnalul ajunge la TV răsturnat).
remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO4
    inverted: true
  carrier_duty_percent: 50%

# unghiul servo-ului SG90, din HA (0-180°)
number:
  - platform: template
    name: "Servo (SG90)"
    icon: "mdi:rotate-right"
    unit_of_measurement: "°"
    min_value: 0
    max_value: 180
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 90
    set_action:
      - servo.write:
          id: servo_sg90
          level: !lambda "return x / 90.0 - 1.0;"  # 0° → -1, 90° → 0, 180° → 1

# codul de trimis, scris din HA (se păstrează după repornire)
text:
  - platform: template
    id: ir_de_trimis
    name: "Cod IR de trimis (HW-489)"
    icon: "mdi:remote"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "NEC 0x00FF 0x45"
    max_length: 40

button:
  - platform: template
    name: "Trimite IR (HW-489)"
    icon: "mdi:remote"
    on_press:
      - script.execute:
          id: trimite_ir
          cod: !lambda "return id(ir_de_trimis).state;"
  # trimite înapoi ce a citit HW-490: învață o tastă de pe telecomandă, apoi o repetă
  - platform: template
    name: "Retrimite ultimul cod IR"
    icon: "mdi:repeat"
    on_press:
      - script.execute:
          id: trimite_ir
          cod: !lambda "return id(ir_primit).state;"

# „PROTOCOL a b” → cod IR pe HW-489. Numerele: hex (0x..) sau zecimal.
# NEC adresă comandă | SAMSUNG date biți | SONY date biți | RC5 adresă comandă | LG date biți
script:
  - id: trimite_ir
    parameters:
      cod: string
    then:
      - lambda: |-
          char proto[16];
          long long a = 0, b = 0;
          if (sscanf(cod.c_str(), "%15s %lli %lli", proto, &a, &b) != 3) {
            ESP_LOGW("ir", "Cod IR necunoscut: '%s' (ex. NEC 0x00FF 0x45)", cod.c_str());
            return;
          }
          auto call = id(ir_tx).transmit();
          auto *data = call.get_data();
          std::string p = proto;
          if (p == "NEC") {
            remote_base::NECProtocol().encode(data, {(uint16_t) a, (uint16_t) b, 1});
          } else if (p == "SAMSUNG") {
            remote_base::SamsungProtocol().encode(data, {(uint64_t) a, (uint8_t) b});
          } else if (p == "SONY") {
            remote_base::SonyProtocol().encode(data, {(uint32_t) a, (uint8_t) b});
            // televizoarele Sony reacționează doar dacă primesc codul de 3 ori
            call.set_send_times(3);
            call.set_send_wait(25000);  // µs
          } else if (p == "RC5") {
            remote_base::RC5Protocol().encode(data, {(uint8_t) a, (uint8_t) b});
          } else if (p == "LG") {
            remote_base::LGProtocol().encode(data, {(uint32_t) a, (uint8_t) b});
          } else {
            ESP_LOGW("ir", "Protocol IR necunoscut: '%s' (NEC, SAMSUNG, SONY, RC5, LG)", proto);
            return;
          }
          ESP_LOGI("ir", "Trimis: %s", cod.c_str());
          call.perform();
