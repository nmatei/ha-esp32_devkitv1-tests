# Telecomandă IR pentru TV-ul Sony: trimite coduri cu emițătorul HW-489 (D4/GPIO4,
# device-builder.yaml). Un cod oarecare de trimis și codurile citite de receptorul HW-490
# sunt în dashboard-ir-citite.yaml.
# Necesită din HACS: card-mod (pentru locurile goale din telecomandă).
type: vertical-stack
cards:
  # TV Sony KD-65XF7096 (protocol Sony SIRC, „SONY date biți”). Codurile vin din listele
  # publice SIRC pentru Bravia, nu au fost citite de pe telecomanda ta: dacă o tastă nu
  # merge, apas-o pe telecomandă spre HW-490 și pune aici codul din „Ultimul cod”.
  # Citite de pe telecomanda ta: Volum + (0x490), Volum − (0xC90), Netflix (0x1F58),
  # YouTube (0x7123).
  # Acțiunea e trimite_ir de pe placă (api: actions:); Sony e trimis de 3 ori.
  # Așezate ca pe telecomandă:
  #   Power  Mute  Home  Return
  #   Vol +   ·     ▲     ·    Prog +
  #     ·     ◄     OK    ►      ·
  #   Vol −   ·     ▼     ·    Prog −
  #   YouTube  Play  Pause  Netflix
  # „·” = loc gol, ascuns cu card_mod (HACS).
  - type: grid
    title: 📺 Sony KD-65XF7096
    columns: 4
    square: false
    cards:
      - type: button
        name: Power
        icon: mdi:power
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xA90 12
      - type: button
        name: Mute
        icon: mdi:volume-off
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x290 12
      - type: button
        name: Home
        icon: mdi:home
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x070 12
      - type: button
        name: Return
        icon: mdi:keyboard-return
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x62E9 15
  - type: grid
    columns: 5
    square: false
    cards:
      - type: button
        name: Volum +
        icon: mdi:volume-plus
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x490 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Sus
        icon: mdi:arrow-up-bold
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x2F0 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Program +
        icon: mdi:chevron-up-box
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x090 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Stânga
        icon: mdi:arrow-left-bold
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x2D0 12
      - type: button
        name: OK
        icon: mdi:checkbox-blank-circle
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xA70 12
      - type: button
        name: Dreapta
        icon: mdi:arrow-right-bold
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xCD0 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Volum −
        icon: mdi:volume-minus
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xC90 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Jos
        icon: mdi:arrow-down-bold
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xAF0 12
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: none
        card_mod:
          style: "ha-card { visibility: hidden; }"
      - type: button
        name: Program −
        icon: mdi:chevron-down-box
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x890 12
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: YouTube
        icon: mdi:youtube
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x7123 15
        # roșu YouTube: doar iconița
        card_mod:
          style: |
            ha-card { --card-mod-icon-color: #FF0000; }
            ha-state-icon { color: #FF0000; }
      - type: button
        name: Play
        icon: mdi:play
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x2CE9 15
      - type: button
        name: Pause
        icon: mdi:pause
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x4CE9 15
      - type: button
        name: Netflix
        icon: mdi:netflix
        icon_height: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x1F58 15
        # roșu Netflix: numele și iconița
        card_mod:
          style: |
            ha-card { color: #E50914; --card-mod-icon-color: #E50914; }
            ha-state-icon { color: #E50914; }
