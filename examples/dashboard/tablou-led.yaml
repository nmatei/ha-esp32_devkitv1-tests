      - type: image
        image: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/%3E"
        style:
          left: 18.47%
          top: 19.44%
          width: 16.27%
          border-radius: 50%
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: NEC 0xEF00 0xFF00
      # Luminozitate −
