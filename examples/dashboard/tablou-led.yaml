# View-ul Tablou LED (tip masonry): telecomanda IR cu 24 de taste a tabloului cu litere,
# desenată ca SVG (telecomanda-led.svg) și trimisă cu emițătorul HW-489 (device-builder.yaml).
# Pune telecomanda-led.svg în /config/www/ (HA îl servește ca /local/telecomanda-led.svg);
# după o modificare a lui, reîncarcă pagina fără cache.
# Nu are nevoie de nimic din HACS: un picture-elements cu SVG-ul ca fundal și câte o zonă
# transparentă, rotundă, peste fiecare tastă.
#
# Protocol NEC, adresa 0xEF00; tasta n (0 … 23, pe rânduri, de la stânga) are comanda
# 0x(FF−n)(n): Luminozitate + 0xFF00, Luminozitate − 0xFE01, OFF 0xFD02, ON 0xFC03,
# R 0xFB04, G 0xFA05, B 0xF906, W 0xF807 citite de pe telecomandă (HW-490); restul
# (0xF708 … 0xE817) continuă regula. Dacă o tastă nu merge, citește-o cu HW-490 și
# pune codul din „Ultimul cod”.
#
# Așezate ca pe telecomandă:
#   Lum +          Lum −           OFF              ON
#   R              G               B                W
#   Roșu deschis   Verde deschis   Albastru deschis FLASH
#   Portocaliu î.  Turcoaz         Violet           STROBE
#   Portocaliu     Albastru-verzui Mov              FADE
#   Galben         Verde închis    Roz              SMOOTH
#
# Zonele (left/top/width, în % din imagine) urmează coordonatele tastelor din SVG
# (viewBox 1180×1980, coloane x 218/466/716/966, rânduri y 385/610/840/1073/1308/1548, r 96).
type: masonry
title: Tablou LED
path: tablou-led
icon: mdi:remote
cards:
  - type: picture-elements
    image: /local/telecomanda-led.svg
    elements:
