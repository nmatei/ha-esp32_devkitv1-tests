# View-ul TV (tip masonry, cu path și visible): telecomanda IR a TV-ului Sony, trimisă cu
# emițătorul HW-489 (D4/GPIO4, device-builder.yaml), plus codurile citite de receptorul
# HW-490 (RX2/GPIO16), un cod oarecare de trimis și istoricul codurilor citite.
# Același format la citire și la trimitere („SONY 0x490 12”): un cod citit se copiază
# în „Cod IR de trimis” sau într-un buton al telecomenzii.
# Nu are nevoie de nimic din HACS. Telecomanda e un desen SVG (telecomanda-tv.svg) cu zone
# transparente peste taste (picture-elements): pune telecomanda-tv.svg în /config/www/
# (HA îl servește ca /local/telecomanda-tv.svg); după o modificare, reîncarcă fără cache.
type: masonry
title: TV
path: tv
icon: mdi:television
cards:
  # TV Sony KD-65XF7096 (protocol Sony SIRC, „SONY date biți”). Codurile vin din listele
  # publice SIRC pentru Bravia, nu au fost citite de pe telecomanda ta: dacă o tastă nu
  # merge, apas-o pe telecomandă spre HW-490 și pune aici codul din „Ultimul cod”.
  # Citite de pe telecomanda ta: Volum + (0x490), Volum − (0xC90), Netflix (0x1F58),
  # YouTube (0x7123).
  # Acțiunea e trimite_ir de pe placă (api: actions:); Sony e trimis de 3 ori.
  # Așezate ca o aplicație de telecomandă, să încapă pe un ecran de telefon:
  #   SONY                          Power
  #   1   2   3   4   5
  #   6   7   8   9   0
  #   [ YouTube ]   [ Netflix ]
  #        cercul: ▲ ◄ OK ► ▼
  #   Vol +   ◄◄    Home   ►►    Prog +
  #   VOL     Mute  ►❙❙    Return  CH
  #   Vol −   |◄◄   Stop   ►►|   Prog −
  # ►❙❙: atingere = Play, ținut apăsat = Pause (Sony are coduri separate).
  # Zonele: left/top = centrul tastei, width = lățimea, în % din desen (viewBox 1000 × 1650);
  # înălțimea vine din viewBox-ul zonei transparente. Dacă muți o tastă în SVG, mut-o și aici.
  - type: picture-elements
    image: /local/telecomanda-tv.svg
    elements:
      # Power
      - type: image
        image: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 110'/%3E"
        style:
          left: 90.20%
          top: 4.85%
          width: 11.00%
          border-radius: 50%
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0xA90 12
      # Cifra 1
      - type: image
        image: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 170 90'/%3E"
        style:
          left: 13.00%
          top: 11.21%
          width: 17.00%
          border-radius: 24px
        tap_action:
          action: perform-action
          perform_action: esphome.esphome_web_3053a0_trimite_ir
          data:
            cod: SONY 0x010 12
      # Cifra 2
