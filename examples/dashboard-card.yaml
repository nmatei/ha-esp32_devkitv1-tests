# Dashboard → Edit → Add card → Manual.
# Entity ids assume the entry is named "ESP32 devkitv1" (the default).
type: vertical-stack
cards:
  - type: entities
    title: 💡 Alfabetul pe fire
    entities:
      - entity: text.esp32_devkitv1_mesaj
      - entity: select.esp32_devkitv1_tip_mesaj
      # ms; each message type keeps its own value (letter time / Morse dot)
      - entity: number.esp32_devkitv1_interval
      # seconds before the message starts again; 0 = play once
      - entity: number.esp32_devkitv1_repeta_dupa
      # The Morse lamp is shown only in Morse mode.
      - type: conditional
        conditions:
          - entity: select.esp32_devkitv1_tip_mesaj
            state: Morse
        row:
          entity: select.esp32_devkitv1_culoare_morse
      - entity: sensor.esp32_devkitv1_progres
  - type: horizontal-stack
    cards:
      - type: button
        entity: button.esp32_devkitv1_start
        name: Start
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.esp32_devkitv1_start
      - type: button
        entity: button.esp32_devkitv1_stop
        name: Stop
        icon: mdi:stop
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.esp32_devkitv1_stop
  - type: glance
    title: Becurile (fir 1 → fir 5)
    entities:
      - entity: light.office_esphome_esp32_devkitv1_led_galben
        name: "1"
      - entity: light.office_esphome_esp32_devkitv1_led_rosu
        name: "2"
      - entity: light.office_esphome_esp32_devkitv1_led_albastru
        name: "3"
      - entity: light.office_esphome_esp32_devkitv1_led_verde
        name: "4"
      - entity: light.office_esphome_esp32_devkitv1_led_alb
        name: "5"
